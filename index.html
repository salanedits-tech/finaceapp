<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Finance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-4 max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-center mb-4">Monthly Finance Tracker</h1>
    
    <!-- Summary Cards -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">
        <h2 class="text-lg font-semibold text-gray-600">Balance: <span id="balance" class="text-black">Rs. 0</span></h2>
    </div>

    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
        <div class="bg-blue-50 p-2 rounded-lg">
            <p class="text-xs text-blue-600 font-bold">Savings</p>
            <p id="total-savings" class="font-bold">Rs. 0</p>
        </div>
        <div class="bg-red-50 p-2 rounded-lg">
            <p class="text-xs text-red-600 font-bold">Expense</p>
            <p id="total-expense" class="font-bold">Rs. 0</p>
        </div>
        <div class="bg-green-50 p-2 rounded-lg">
            <p class="text-xs text-green-600 font-bold">Income</p>
            <p id="total-income" class="font-bold">Rs. 0</p>
        </div>
    </div>

    <!-- Add Entry Form -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">
        <h2 class="font-bold mb-3">Add New Entry</h2>
        <form id="entry-form" class="space-y-3">
            <div>
                <label class="block text-sm font-medium">Type</label>
                <select id="type" class="w-full p-2 border rounded-lg">
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                    <option value="Savings">Savings</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Description / Name</label>
                <input type="text" id="desc" placeholder="e.g. Salary, Rent, Grocery" class="w-full p-2 border rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm font-medium">Amount (Rs.)</label>
                <input type="number" id="amount" placeholder="0" class="w-full p-2 border rounded-lg" required>
            </div>
            <div>
                <label class="block text-sm font-medium">Date</label>
                <input type="date" id="date" class="w-full p-2 border rounded-lg" required>
            </div>
            <button type="submit" class="w-full bg-black text-white p-2 rounded-lg font-bold">Save Entry</button>
        </form>
    </div>

    <!-- History -->
    <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="font-bold mb-2">History</h2>
        <ul id="transaction-list" class="space-y-2 text-sm">
            <!-- Dynamic items will go here -->
        </ul>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();
        
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function saveAndRender() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            render();
        }

        document.getElementById('entry-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const date = document.getElementById('date').value;

            transactions.push({ type, desc, amount, date });
            saveAndRender();
            this.reset();
            document.getElementById('date').valueAsDate = new Date();
        });

        function render() {
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            let income = 0, expense = 0, savings = 0;

            transactions.forEach((t, index) => {
                if(t.type === 'Income') income += t.amount;
                if(t.type === 'Expense') expense += t.amount;
                if(t.type === 'Savings') savings += t.amount;

                const li = document.createElement('li');
                li.className = "flex justify-between items-center border-b pb-1";
                li.innerHTML = `<span><b>${t.desc}</b> (${t.date}) - Rs. ${t.amount} [${t.type}]</span>
                                <button onclick="deleteItem(${index})" class="text-red-500 text-xs">Delete</button>`;
                list.appendChild(li);
            });

            document.getElementById('total-income').innerText = 'Rs. ' + income;
            document.getElementById('total-expense').innerText = 'Rs. ' + expense;
            document.getElementById('total-savings').innerText = 'Rs. ' + savings;
            document.getElementById('balance').innerText = 'Rs. ' + (income - expense);
        }

        function deleteItem(index) {
            transactions.splice(index, 1);
            saveAndRender();
        }

        render();
    </script>
</body>
</html>
